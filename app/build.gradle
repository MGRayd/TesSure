plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.co.pactsolutions.teslachecklist'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.pactsolutions.teslachecklist'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TesSure-${variant.name}-${variant.versionName}.apk"
        }
    }
}
